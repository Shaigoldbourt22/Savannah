name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Binance.LocalOrderBook.sln
      - name: Build
        run: dotnet build Binance.LocalOrderBook.sln --configuration Release --no-restore -warnaserror
      - name: Test
        run: dotnet test Binance.LocalOrderBook.sln --configuration Release --no-build --no-restore --filter 'Category!=Stress&Category!=Staging'
